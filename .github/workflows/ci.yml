name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
      - run: npm run package:check
      - run: mkdir -p artifacts
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: dsh-feishu-im-tarball
          path: artifacts/*.tgz
          if-no-files-found: error
